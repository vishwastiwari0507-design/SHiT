[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "SHiT"
version = "1.0.0"
description = "Molecular dynamics trajectory analysis tools"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

dependencies = [
    "numpy>=1.22",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.5"]
dev   = ["pytest>=7", "matplotlib>=3.5"]

[project.scripts]
shit = "SHiT.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["SHiT*"]
